<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Quiz de Conhecimentos Gerais</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <header>
        <div class="logo">
            <h1>MundoQuiz</h1>
        </div>
        <nav class="nav-links">
            <button id="btn-reiniciar">Reiniciar Quiz</button>
        </nav>
    </header>

    <main>
        <aside class="sidebar">
            <h3>Categorias</h3>
            <ul>
                <li>🌍 Geografia</li>
                <li>🧪 Ciência</li>
                <li>🎨 Arte</li>
                <li>📜 História</li>
            </ul>
        </aside>

        <section class="content">
            <div class="quiz-box">
                <p class="stats">Questão 1 de 10</p>
                <h2 id="question-text">Qual é o maior planeta do nosso sistema solar?</h2>
                
                <div class="cards-grid">
                    <button class="answer-card">Marte</button>
                    <button class="answer-card">Júpiter</button>
                    <button class="answer-card">Saturno</button>
                    <button class="answer-card">Netuno</button>
                </div>
            </div>
        </section>

        <aside class="aside">
            <h3>Top Jogadores</h3>
            <ol>
                <li>Ana: 950 pts</li>
                <li>Carlos: 820 pts</li>
            </ol>
        </aside>
    </main>
</body>
</html>
